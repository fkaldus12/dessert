<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>이미지 타입</title>
        <link rel="stylesheet" href="font.css" />
        <link rel="stylesheet" href="reset.css" />
        <link rel="stylesheet" href="image.css" />
    </head>
    <body>
        <section id="imageType">
            <div class="container">
                <div class="hover_wrap">
                    <div class="txt">
                        <h1 class="bld">
                            프리미엄 케이크와 디저트를 만나보세요.
                        </h1>
                        <p>
                            유러피언 디저트의 본질을 추구한 고급 원재료와
                            차별화된 레시피
                        </p>
                    </div>
                    <div class="hover_inner">
                        <figcaption class="hover1">
                            <div class="desc">
                                <h2>프렌치크라상</h2>
                                <p>
                                    버터 특유의 깊은 풍미를 지닌 프랑스산 이즈니
                                    생메르 버터를 더해, <br />겹겹이 쌓인 결
                                    사이로 진한 버터 풍미가 촉촉하게 배어든
                                    기본을 지켜
                                    <br />
                                    제대로 만든 프렌치스타일 크라상
                                </p>
                                <div class="imageButton">
                                    <a href="#">자세히 보기</a>
                                </div>
                            </div>
                        </figcaption>
                        <figcaption class="hover2">
                            <div class="desc">
                                <h2>통곡물 호밀 깜빠뉴</h2>
                                <p>
                                    호밀, 귀리 , 호박씨등 건강한 곡물&씨앗
                                    가득한 <br />고소한 풍미의 호밀 깜빠뉴
                                </p>
                                <div class="imageButton">
                                    <a href="#">자세히 보기</a>
                                </div>
                            </div>
                        </figcaption>
                    </div>
                </div>
            </div>
        </section>
    </body>
</html>
